[project]
name = "argos-brain"
version = "0.1.0"
description = "The brain of Argos: state machine, records, body, senses and voice."
requires-python = ">=3.12,<3.13"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "models", "var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
